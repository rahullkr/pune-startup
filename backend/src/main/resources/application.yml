spring:
  application:
    name: pune-startup-backend

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pune_startup}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_locally}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app_user}
    password: ${RABBITMQ_PASSWORD:change_me_locally}
    listener:
      simple:
        default-requeue-rejected: false

  servlet:
    multipart:
      max-file-size: ${RESUME_MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${RESUME_MAX_REQUEST_SIZE:7MB}

server:
  port: 8080

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.punestartup: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-none}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin:
    api-key: ${ADMIN_API_KEY:local-dev-admin-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    session-ttl: ${AUTH_SESSION_TTL:PT720H}
  search:
    max-page-size: 50
    default-page-size: 20
  jobs:
    fresher-max-experience-years: 1.0
  ingestion:
    scheduler:
      enabled: ${INGESTION_SCHEDULER_ENABLED:true}
      poll-interval: ${INGESTION_SCHEDULER_POLL_INTERVAL:PT1M}
      initial-delay: ${INGESTION_SCHEDULER_INITIAL_DELAY:PT1M}
      missed-run-grace: ${INGESTION_SCHEDULER_MISSED_RUN_GRACE:PT15M}
    freshness:
      stale-after-missing-checks: 2
      expire-after-missing-checks: 6
  map:
    max-viewport-span-degrees: 5.0
    max-map-markers: 500
    max-radius-meters: 50000
    max-nearby-results: 50
  storage:
    r2:
      enabled: ${R2_ENABLED:true}
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET_NAME:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      region: ${R2_REGION:auto}
      presign-expiry: ${R2_PRESIGN_EXPIRY:PT5M}
  resume:
    max-size-bytes: ${RESUME_MAX_SIZE_BYTES:5242880}
    retention-days: ${RESUME_RETENTION_DAYS:30}
    parse-timeout: ${RESUME_PARSE_TIMEOUT:PT30S}
    max-parsed-characters: ${RESUME_MAX_PARSED_CHARACTERS:200000}
    cleanup-enabled: ${RESUME_CLEANUP_ENABLED:true}
    cleanup-interval: ${RESUME_CLEANUP_INTERVAL:PT1H}
    cleanup-initial-delay: ${RESUME_CLEANUP_INITIAL_DELAY:PT1M}
